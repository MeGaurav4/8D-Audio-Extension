<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>8D Audio Converter · Convert files</title>
  <link rel="icon" href="images/icon48.png">
  <style>
    :root { --bg: #1e1e1e; --card: #2a2a2a; --line: #3a3a3a; --text: #f0f0f0; --dim: #a8a8a8; --lime: #ddff00; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { color: var(--dim); margin: 0 0 24px; }
    #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    #drop.over { border-color: var(--lime); background: rgba(221,255,0,0.05); }
    #drop strong { color: var(--lime); }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
    label { font-size: 13px; display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--lime); }
    select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip { padding: 6px 11px; border-radius: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
    .chip.active { background: var(--lime); color: var(--bg); border-color: var(--lime); }
    button.main { background: var(--lime); color: var(--bg); border: none; border-radius: 8px; padding: 12px 18px; font-weight: bold; font-size: 15px; cursor: pointer; }
    button.main:disabled { opacity: 0.5; cursor: default; }
    .file { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .file:last-child { border-bottom: none; }
    .file .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file .status { color: var(--dim); font-size: 12px; }
    .file audio { grid-column: 1 / -1; width: 100%; height: 34px; }
    .file a { color: var(--lime); font-weight: bold; text-decoration: none; font-size: 14px; }
    progress { width: 100%; accent-color: var(--lime); }
    .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Convert songs to 8D</h1>
    <p class="sub">Your files never leave your computer. Everything runs right here in the browser, free.</p>

    <div id="drop">
      <div><strong>Drop songs here</strong> or click to pick files</div>
      <div class="note">MP3, WAV, M4A, OGG, FLAC, anything Chrome can play</div>
      <input type="file" id="files" accept="audio/*,video/*" multiple hidden>
    </div>

    <div class="card">
      <div class="chips" id="presets"></div>
      <div class="grid">
        <div><label>Effect intensity <span id="intensityValue">1.5</span></label><input type="range" id="intensity" min="0.5" max="3" step="0.1" value="1.5"></div>
        <div><label>Rotation speed <span id="lapValue">5.0s per lap</span></label><input type="range" id="rotationSpeed" min="0.005" max="0.1" step="0.005" value="0.02"></div>
        <div><label>Reverb <span id="reverbValue">0%</span></label><input type="range" id="reverb" min="0" max="1" step="0.05" value="0"></div>
        <div><label>Movement</label><select id="pattern"></select></div>
        <div><label>Bass <span id="bassValue">0 dB</span></label><input type="range" id="bass" min="-12" max="12" step="1" value="0"></div>
        <div><label>Treble <span id="trebleValue">0 dB</span></label><input type="range" id="treble" min="-12" max="12" step="1" value="0"></div>
      </div>
      <p class="note">Tip: headphones on. Settings start from whatever you use in the popup.</p>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <strong id="count">No files yet</strong>
        <button class="main" id="convert" disabled>Convert to 8D</button>
      </div>
      <div id="list"></div>
    </div>
  </main>
  <script src="engine.js"></script>
  <script src="wav.js"></script>
  <script src="converter.js"></script>
</body>
</html>
